packages:
  # apps/* covers api, web, worker, mcp-server, and marketing.
  - 'apps/*'
  - 'packages/*'
  # twenty-bidstack is preserved verbatim from the handoff zip as a future
  # migration target. Its dependencies (twenty-shared, twenty-server, etc.)
  # only resolve when this package is dropped into the upstream Twenty fork
  # at packages/twenty-bidstack. Excluded from the standalone workspace.
  - '!packages/twenty-bidstack'
  # apps/mobile is an Expo/React Native app whose deps aren't part of the web /
  # api / worker deploy; its specifiers were never lockfile-synced, which broke
  # frozen installs on Railway + Vercel. Excluded from the standalone workspace.
  - '!apps/mobile'
