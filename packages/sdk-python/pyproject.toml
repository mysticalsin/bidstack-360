[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bidstack-crm"
version = "0.1.0"
description = "Official Python SDK for the BidStack 360° CRM API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "BidStack Engineering", email = "sdk@bidstack.io" }]
keywords = ["crm", "bidstack", "sales", "api-client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = ["httpx>=0.27.0", "pydantic>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/bidstack/bidstack-py"
Documentation = "https://docs.bidstack.io/sdks/python"
Repository = "https://github.com/bidstack/bidstack-py"
"Bug Tracker" = "https://github.com/bidstack/bidstack-py/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["bidstack_crm*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py39"
line-length = 100
