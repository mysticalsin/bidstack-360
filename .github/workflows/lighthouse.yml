name: Lighthouse CI

on:
  push:
    branches: [main, demo, 'release/**']
  pull_request:
    branches: [main, demo]

# Cancel previous runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must equal package.json packageManager. A major-only pin ("10") makes
  # pnpm/action-setup abort before install when that field is pnpm@10.27.0.
  PNPM_VERSION: '10.27.0'

# Least-privilege default token. The lighthouse job re-grants pull-requests:write
# at job level for its PR comment.
permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse CI
    # ubuntu-latest is 26.04. Playwright 1.59 has no Chromium build there, and
    # the image's Chrome 157 returns NO_FCP for this app. Shards on 24.04
    # painted the same pages with Playwright's Chromium.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # rfp_vector_indexes creates extension "vector". Alpine Postgres has no pgvector.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bidstack
          POSTGRES_PASSWORD: bidstack_test
          POSTGRES_DB: bidstack_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bidstack"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The audited dashboard calls /api. Without this API it paints
      # "Could not load dashboard", and that error is the LCP element.
      NODE_ENV: test
      DATABASE_URL: postgres://bidstack:bidstack_test@localhost:5432/bidstack_test
      REDIS_URL: redis://localhost:6379
      VITE_AUTH_MODE: stub
      BIDSTACK_ALLOW_STUB_AUTH: 'true'
    permissions:
      pull-requests: write # needed for PR comment
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build shared + web (web depends on @bidstack/shared types)
      - name: Build shared packages
        run: pnpm --filter @bidstack/shared build

      - name: Build web
        run: pnpm --filter @bidstack/web build
        env:
          # Stub auth, same as the E2E build. A non-empty publishable key
          # selects Clerk even when VITE_AUTH_MODE=stub. Leave the key unset.
          # Leave VITE_API_URL unset so the built app calls relative /api and
          # vite preview proxies that to the API started below.
          VITE_AUTH_MODE: stub
          BIDSTACK_ALLOW_STUB_AUTH: 'true'

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build packages the API loads
        run: pnpm --filter "@bidstack/api^..." build

      - name: Migrate + seed database
        run: |
          pnpm db:migrate:deploy
          pnpm db:seed

      - name: Start API
        run: |
          pnpm --filter @bidstack/api exec tsx src/main.ts > "${RUNNER_TEMP}/api.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4000/livez >/dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready"
          cat "${RUNNER_TEMP}/api.log"
          exit 1

      - name: Install Playwright Chromium
        # Use the same browser that painted these pages in the E2E shards.
        # The image Chrome still reported NO_FCP after SwiftShader flags.
        run: pnpm --filter @bidstack/web exec playwright install --with-deps chromium

      - name: Install Lighthouse CI
        # 0.14.x bundles Lighthouse 12.1.0. 0.16.1 bundles Lighthouse 13.6.0.
        run: npm install -g @lhci/cli@0.16.1

      - name: Run Lighthouse CI
        id: lhci
        # Root package.json is "type": "module", so Node loads .lighthouserc.js
        # as ESM and rejects its module.exports. LHCI needs that file as CJS.
        # Headless Chrome and headful Chrome under xvfb both loaded /login and
        # returned NO_FCP until the virtual window was marked visible. SwiftShader
        # then painted, and its software rasterizer showed up as multi-second
        # unattributable main-thread tasks. Keep the occlusion flags and let
        # Chrome use the GPU. chromeFlags stays one string. headful skips
        # LHCI's --headless=new. The ready pattern is localhost: because Vite
        # puts an ANSI code between Local and the colon.
        # The product lighthouserc.js is not edited.
        run: |
          cp .lighthouserc.js "${RUNNER_TEMP}/lighthouserc.cjs"
          node --input-type=commonjs -e 'const fs=require("fs"); const config=require(process.env.RUNNER_TEMP+"/lighthouserc.cjs"); config.ci.collect.headful=true; config.ci.collect.startServerReadyPattern="localhost:"; config.ci.collect.settings=Object.assign({}, config.ci.collect.settings, {chromeFlags:"--no-sandbox --disable-dev-shm-usage --disable-background-timer-throttling --disable-backgrounding-occluded-windows --disable-renderer-backgrounding --disable-features=CalculateNativeWinOcclusion --window-size=1280,800"}); fs.writeFileSync(process.env.RUNNER_TEMP+"/lighthouserc-ci.cjs","module.exports="+JSON.stringify(config)+"\n");'
          export CHROME_PATH="$(pnpm --filter @bidstack/web exec node --input-type=commonjs -e 'process.stdout.write(require("@playwright/test").chromium.executablePath())' | tail -n 1)"
          echo "CHROME_PATH=$CHROME_PATH"
          test -x "$CHROME_PATH"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" lhci autorun --config="${RUNNER_TEMP}/lighthouserc-ci.cjs"
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lighthouse-report-${{ github.sha }}
          path: '.lighthouseci/'
          retention-days: 14

      # Post a summary comment on PRs so reviewers see scores without
      # leaving GitHub. Uses the LHCI JSON output.
      - name: Comment Lighthouse scores on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = '.lighthouseci';
            if (!fs.existsSync(dir)) {
              console.log('No LHCI output directory found, skipping comment.');
              return;
            }
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.json') && !f.startsWith('manifest'));
            const reports = files.map(f => JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8')));
            if (!reports.length) {
              console.log('No report JSON files found.');
              return;
            }
            // Average across all URLs
            const cats = ['performance', 'accessibility', 'best-practices', 'seo'];
            const avgs = Object.fromEntries(cats.map(cat => {
              const scores = reports.map(r => (r.categories?.[cat]?.score ?? 0) * 100);
              return [cat, Math.round(scores.reduce((a, b) => a + b, 0) / scores.length)];
            }));
            const emoji = s => s >= 97 ? '🟢' : s >= 90 ? '🟡' : '🔴';
            const body = [
              '## Lighthouse CI Results',
              '',
              `| Category | Score | Status |`,
              `|---|---|---|`,
              `| Performance | ${avgs.performance} | ${emoji(avgs.performance)} |`,
              `| Accessibility | ${avgs.accessibility} | ${emoji(avgs.accessibility)} |`,
              `| Best Practices | ${avgs['best-practices']} | ${emoji(avgs['best-practices'])} |`,
              `| SEO | ${avgs.seo} | ${emoji(avgs.seo)} |`,
              '',
              `Thresholds: Performance ≥97 (warn ≥90) · Accessibility ≥100 · Best Practices ≥95 · SEO ≥95`,
              `URLs tested: ${reports.length}`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('## Lighthouse CI Results'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
