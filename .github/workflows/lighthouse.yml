name: Lighthouse CI

on:
  push:
    branches: [main, demo, 'release/**']
  pull_request:
    branches: [main, demo]

# Cancel previous runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '10'

# Least-privilege default token. The lighthouse job re-grants pull-requests:write
# at job level for its PR comment.
permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pull-requests: write # needed for PR comment
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build shared + web (web depends on @bidstack/shared types)
      - name: Build shared packages
        run: pnpm --filter @bidstack/shared build

      - name: Build web
        run: pnpm --filter @bidstack/web build
        env:
          # Stub auth token for preview mode — no real backend needed for LHCI
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          VITE_AUTH_MODE: stub
          BIDSTACK_ALLOW_STUB_AUTH: 'true'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI
        id: lhci
        run: lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-report-${{ github.sha }}
          path: '.lighthouseci/'
          retention-days: 14

      # Post a summary comment on PRs so reviewers see scores without
      # leaving GitHub. Uses the LHCI JSON output.
      - name: Comment Lighthouse scores on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = '.lighthouseci';
            if (!fs.existsSync(dir)) {
              console.log('No LHCI output directory found, skipping comment.');
              return;
            }
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.json') && !f.startsWith('manifest'));
            const reports = files.map(f => JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8')));
            if (!reports.length) {
              console.log('No report JSON files found.');
              return;
            }
            // Average across all URLs
            const cats = ['performance', 'accessibility', 'best-practices', 'seo'];
            const avgs = Object.fromEntries(cats.map(cat => {
              const scores = reports.map(r => (r.categories?.[cat]?.score ?? 0) * 100);
              return [cat, Math.round(scores.reduce((a, b) => a + b, 0) / scores.length)];
            }));
            const emoji = s => s >= 97 ? '🟢' : s >= 90 ? '🟡' : '🔴';
            const body = [
              '## Lighthouse CI Results',
              '',
              `| Category | Score | Status |`,
              `|---|---|---|`,
              `| Performance | ${avgs.performance} | ${emoji(avgs.performance)} |`,
              `| Accessibility | ${avgs.accessibility} | ${emoji(avgs.accessibility)} |`,
              `| Best Practices | ${avgs['best-practices']} | ${emoji(avgs['best-practices'])} |`,
              `| SEO | ${avgs.seo} | ${emoji(avgs.seo)} |`,
              '',
              `Thresholds: Performance ≥97 (warn ≥90) · Accessibility ≥100 · Best Practices ≥95 · SEO ≥95`,
              `URLs tested: ${reports.length}`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('## Lighthouse CI Results'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
