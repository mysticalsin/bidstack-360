# Semgrep SAST — runs on every push to main and every PR.
# Rulesets are the OWASP curated bundles + language-specific high-signal sets.
# `semgrep ci` rejects --severity and --error, so the scan never starts.
# `semgrep scan` accepts both: ERROR is the code-as-vulnerability tier, and
# --error exits non-zero when any of those findings remain.

name: Semgrep SAST

on:
  pull_request:
    branches: [main, demo]
  push:
    branches: [main, demo, 'release/**']

# Limit GITHUB_TOKEN to the minimum surface needed: read source + write SARIF
# results into GitHub Security. Anything broader is a privilege escalation
# surface for compromised workflow dependencies.
permissions:
  contents: read
  security-events: write

concurrency:
  group: semgrep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip on Dependabot updates — they don't change application source.
    if: github.actor != 'dependabot[bot]'
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Semgrep
        run: |
          semgrep scan \
            --metrics=off \
            --error \
            --severity ERROR \
            --sarif \
            --output=semgrep.sarif \
            --config p/typescript \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/javascript \
            --config p/dockerfile \
            .

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
