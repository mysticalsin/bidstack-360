name: CI

on:
  push:
    branches: [main, demo, 'release/**']
  pull_request:
    branches: [main, demo]

# Cancel previous runs on the same branch — saves CI minutes on rapid pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '10'

jobs:
  # Fast unit gates — typecheck + lint + unit tests + bundle-size guard.
  # No DB needed; runs on every push and PR.
  unit:
    name: Unit (typecheck + lint + test + build + bundle guard)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (high+)
        run: pnpm audit --audit-level high
        continue-on-error: false

      - name: Generate Prisma client
        # Required before typecheck — apps import from the generated client.
        run: pnpm db:generate

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test (no DB — integration suites self-skip via DATABASE_URL guard)
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

      - name: Verify PWA manifest exists
        run: |
          test -f apps/web/dist/manifest.json || (echo "::error::manifest.json missing from dist" && exit 1)
          test -f apps/web/dist/sw.js || (echo "::error::sw.js missing from dist" && exit 1)
          test -f apps/web/dist/icon-192.png || (echo "::error::icon-192.png missing from dist" && exit 1)
          test -f apps/web/dist/icon-512.png || (echo "::error::icon-512.png missing from dist" && exit 1)

      - name: Bundle size guard (web)
        # Hard-fail if any non-react chunk exceeds 200 KB minified — catches
        # accidental bundling of heavy deps in app code. React itself
        # (~340-360 KB) is whitelisted because react-dom production has a
        # ~145 KB intrinsic floor and Clerk pulls extras.
        run: |
          set -e
          cd apps/web
          BIG=$(find dist/assets -name "*.js" -size +200k 2>/dev/null | grep -v "react-" || true)
          if [ -n "$BIG" ]; then
            echo "::error::Web chunk over 200KB (excluding react-*):"
            echo "$BIG" | xargs ls -lah
            exit 1
          fi

  # Full-tree secret scan — catches credentials that slipped past the
  # pre-commit hook (e.g. branch imports, partial reverts). Independent of
  # gitleaks: this enforces the BidStack-specific pattern set from
  # scripts/check-secrets.sh on every tracked file.
  secrets-full-scan:
    name: Full-tree secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
      - name: Scan tracked files
        run: bash scripts/check-secrets.sh --full

  # Heavy integration tests against real Postgres + Redis.
  # Runs on PRs only (skipped on main pushes since main is post-merge).
  integration:
    name: Integration (Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    needs: unit

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bidstack
          POSTGRES_PASSWORD: bidstack_test
          POSTGRES_DB: bidstack_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bidstack"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://bidstack:bidstack_test@localhost:5432/bidstack_test
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate + seed
        run: |
          pnpm db:generate
          pnpm db:migrate:deploy
          pnpm db:seed

      - name: API integration tests
        run: pnpm --filter @bidstack/api test

      - name: MCP server tests (DB-backed)
        run: pnpm --filter @bidstack/mcp-server test

      - name: Worker queue tests (Redis-backed)
        run: pnpm --filter @bidstack/worker test

  # E2E smoke against a built preview + a running API.
  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'pull_request'
    needs: integration

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bidstack
          POSTGRES_PASSWORD: bidstack_test
          POSTGRES_DB: bidstack_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bidstack"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://bidstack:bidstack_test@localhost:5432/bidstack_test
      REDIS_URL: redis://localhost:6379
      VITE_API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}

      - name: Install Playwright Chromium (with deps)
        run: pnpm --filter @bidstack/web exec playwright install --with-deps chromium

      - name: Migrate + seed
        run: |
          pnpm db:generate
          pnpm db:migrate:deploy
          pnpm db:seed

      - name: Build web
        run: pnpm --filter @bidstack/web build

      - name: Start API in background
        run: |
          pnpm --filter @bidstack/api dev &
          # Wait up to 30s for /health.
          for i in {1..30}; do
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "API up after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run Playwright smoke suite
        env:
          E2E_API_URL: http://localhost:4000
        run: pnpm --filter @bidstack/web e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
