name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel previous runs on the same branch — saves CI minutes on rapid pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10'

jobs:
  # Fast unit gates — typecheck + lint + unit tests.
  # No DB needed; runs on every push regardless of file paths.
  unit:
    name: Unit (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        # Required before typecheck — apps import from the generated client.
        run: pnpm --filter @bidstack/db generate

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test (no DB)
        # apps/api integration tests skip themselves when DATABASE_URL is unset
        # via the skipIfNoDb helper. Pure unit + fixture guards run here.
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

      - name: Bundle size guard (web)
        # Hard-fails CI if the production web bundle balloons unexpectedly.
        # Threshold matches the manualChunks split + react-dom floor.
        run: |
          set -e
          cd apps/web
          BIG=$(find dist/assets -name "*.js" -size +400k 2>/dev/null | grep -v "react-" || true)
          if [ -n "$BIG" ]; then
            echo "::error::Web chunk over 400KB (excluding react-*):"
            echo "$BIG" | xargs ls -lah
            exit 1
          fi

  # Heavy integration tests against real Postgres + Redis.
  # Runs on PRs only (skipped on main pushes since main is post-merge).
  integration:
    name: Integration (Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bidstack
          POSTGRES_PASSWORD: bidstack
          POSTGRES_DB: bidstack
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U bidstack"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://bidstack:bidstack@localhost:5433/bidstack?schema=public
      REDIS_URL: redis://localhost:6380
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate + seed
        run: |
          pnpm --filter @bidstack/db generate
          pnpm db:migrate
          pnpm db:seed

      - name: API integration tests
        run: pnpm --filter @bidstack/api test

  # E2E smoke against a built preview + a running API.
  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'pull_request'
    needs: integration

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bidstack
          POSTGRES_PASSWORD: bidstack
          POSTGRES_DB: bidstack
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U bidstack"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7
        ports: ['6380:6379']

    env:
      DATABASE_URL: postgresql://bidstack:bidstack@localhost:5433/bidstack?schema=public
      REDIS_URL: redis://localhost:6380
      NODE_ENV: test
      VITE_API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}

      - name: Install Playwright Chromium
        run: pnpm --filter @bidstack/web exec playwright install --with-deps chromium

      - name: Migrate + seed
        run: |
          pnpm --filter @bidstack/db generate
          pnpm db:migrate
          pnpm db:seed

      - name: Build web
        run: pnpm --filter @bidstack/web build

      - name: Start API in background
        run: |
          pnpm --filter @bidstack/api dev &
          # Wait up to 30s for /health.
          for i in {1..30}; do
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "API up after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run smoke suite
        env:
          E2E_API_URL: http://localhost:4000
        run: pnpm --filter @bidstack/web e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
