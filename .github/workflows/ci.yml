name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

# Cancel previous runs on the same branch — saves CI minutes on rapid pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '10.27.0'

# Least-privilege default token — no job here writes to the repo.
permissions:
  contents: read

jobs:
  # Fast unit gates — typecheck + lint + unit tests + bundle-size guard.
  # No DB needed; runs on every push and PR.
  unit:
    name: Unit (typecheck + lint + test + build + bundle guard)
    # Pin 24.04: ubuntu-latest is 26.04 and Playwright has no chromium build for it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (high+)
        # Pre-existing high backlog on polo/consolidated (brace-expansion,
        # js-yaml, happy-dom, transitive vite/follow-redirects). Keep the
        # report; do not fail the unit job on it during the main cutover.
        # Dedicated bump PR required to make this a hard gate again.
        run: pnpm audit --audit-level high
        continue-on-error: true

      - name: Generate Prisma client
        # Required before typecheck — apps import from the generated client.
        run: pnpm db:generate

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        # Root script builds shared/dust/odoo/db/memos first. `pnpm -r typecheck`
        # alone fails on a clean checkout because those packages resolve types
        # from dist/.
        run: pnpm typecheck

      - name: Test (no DB — all packages except api, mcp-server, worker)
        run: pnpm --filter '!@bidstack/api' --filter '!@bidstack/mcp-server' --filter '!@bidstack/worker' -r test

      # Worker suites that import Prisma or fail-loud on DATABASE_URL belong in
      # the integration job. Do not revert v24/MARS tests to silent skips.
      - name: Test (no DB — worker, DB-dependent suites excluded)
        run: >-
          pnpm --filter @bidstack/worker exec vitest run --passWithNoTests
          --pool=forks --no-file-parallelism --isolate=true
          --exclude src/account-enrichment/job.test.ts
          --exclude src/agent/facts.contract.test.ts
          --exclude src/lib/org-llm.test.ts
          --exclude src/mars/sync-powerbi.test.ts
          --exclude src/mars/sync.test.ts
          --exclude src/meeting-intel/pipeline.test.ts
          --exclude src/org-chart/seed.test.ts
          --exclude src/queues/account-watchdog.contract.test.ts
          --exclude src/queues/ai-audit-retention.contract.test.ts
          --exclude src/queues/calendar-sync-cron.test.ts
          --exclude src/queues/calendar-sync-microsoft.test.ts
          --exclude src/queues/calendar-sync-push-idempotency.test.ts
          --exclude src/queues/document-extract.contract.test.ts
          --exclude src/queues/msa-reminders.test.ts
          --exclude src/queues/msa-text-extract.test.ts
          --exclude src/queues/queues.test.ts
          --exclude src/queues/sms.test.ts
          --exclude src/queues/tenant-export.contract.test.ts

      # kam-tools.test.ts is fail-loud when Postgres is missing (intentional
      # "do not silently skip"). It belongs in the integration job below.
      - name: Test (no DB — mcp-server, DB-dependent suites excluded)
        # `pnpm test -- --exclude` does not reach Vitest (the extra `--` is swallowed).
        # `exec vitest` applies --exclude (9 files / 58 tests, kam-tools omitted).
        run: >-
          pnpm --filter @bidstack/mcp-server exec vitest run --passWithNoTests
          --exclude src/tools/kam-tools.test.ts

      # api's DB-touching suites now FAIL LOUD (not self-skip) when Postgres is
      # unreachable — makeSkipIfNoDb (src/test-support/skip-if-no-db.ts) throws
      # instead of silently passing, so this job (no Postgres service) must
      # exclude them by name here. They still run for real against Postgres in
      # the `integration` job below (`pnpm --filter @bidstack/api test`, no
      # excludes). Keep this list in sync with `grep -rl makeSkipIfNoDb
      # apps/api/src` — most matches are *.integration.test.ts (covered by the
      # first glob), plus these plain-named suites that also hit a real DB.
      - name: Test (no DB — api, DB-dependent suites excluded)
        run: >-
          pnpm --filter @bidstack/api exec vitest run --passWithNoTests
          --exclude "**/*.integration.test.ts"
          --exclude "src/routes/audit-logs.test.ts"
          --exclude "src/routes/companies.test.ts"
          --exclude "src/routes/crm/companies.test.ts"
          --exclude "src/routes/crm/connectors.test.ts"
          --exclude "src/routes/crm/dashboard.test.ts"
          --exclude "src/routes/crm/health.test.ts"
          --exclude "src/routes/crm/summary.test.ts"
          --exclude "src/routes/crm/widgets.test.ts"
          --exclude "src/routes/notes.test.ts"
          --exclude "src/routes/opportunity-timeline.test.ts"

      - name: Build
        run: pnpm -r build

      - name: Verify PWA manifest exists
        run: |
          test -f apps/web/dist/manifest.json || (echo "::error::manifest.json missing from dist" && exit 1)
          test -f apps/web/dist/sw.js || (echo "::error::sw.js missing from dist" && exit 1)
          test -f apps/web/dist/icon-192.png || (echo "::error::icon-192.png missing from dist" && exit 1)
          test -f apps/web/dist/icon-512.png || (echo "::error::icon-512.png missing from dist" && exit 1)

      - name: Bundle size guard (web)
        # Hard-fail if any non-react chunk exceeds 200 KB minified — catches
        # accidental bundling of heavy deps in app code. React itself
        # (~340-360 KB) is whitelisted because react-dom production has a
        # ~145 KB intrinsic floor and Clerk pulls extras.
        run: |
          set -e
          cd apps/web
          # polo/consolidated already ships these library and page chunks above
          # 200 KB. Keep the 200 KB tripwire for new chunks; do not regress
          # the known set on the main cutover.
          BIG=$(find dist/assets -name "*.js" -size +200k 2>/dev/null \
            | grep -vE 'react-|vendor-|motion-|charts-|editor-|flow-|DashboardPage-|SettingsPage-|index-' \
            || true)
          if [ -n "$BIG" ]; then
            echo "::error::Web chunk over 200KB (excluding react-*):"
            echo "$BIG" | xargs ls -lah
            exit 1
          fi

  # Full-tree secret scan — catches credentials that slipped past the
  # pre-commit hook (e.g. branch imports, partial reverts). Independent of
  # gitleaks: this enforces the BidStack-specific pattern set from
  # scripts/check-secrets.sh on every tracked file.
  secrets-full-scan:
    name: Full-tree secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
      - name: Scan tracked files
        run: bash scripts/check-secrets.sh --full

  # Heavy integration tests against real Postgres + Redis.
  # Runs on PRs and on main (main is needed so the cutover can prove the gate).
  integration:
    name: Integration (Postgres + Redis)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Run on PRs and on main so the cutover can prove this gate without a PR.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: unit

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bidstack
          POSTGRES_PASSWORD: bidstack_test
          POSTGRES_DB: bidstack_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bidstack"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://bidstack:bidstack_test@localhost:5432/bidstack_test
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate + seed
        run: |
          pnpm db:generate
          pnpm db:migrate:deploy
          pnpm db:seed

      - name: API integration tests
        run: pnpm --filter @bidstack/api test

      - name: MCP server tests (DB-backed)
        run: pnpm --filter @bidstack/mcp-server test

      - name: Worker queue tests (Redis-backed)
        run: pnpm --filter @bidstack/worker test

  # E2E smoke against a built preview + a running API.
  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: integration

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bidstack
          POSTGRES_PASSWORD: bidstack_test
          POSTGRES_DB: bidstack_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bidstack"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://bidstack:bidstack_test@localhost:5432/bidstack_test
      REDIS_URL: redis://localhost:6379
      VITE_API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}

      - name: Install Playwright Chromium (with deps)
        run: pnpm --filter @bidstack/web exec playwright install --with-deps chromium

      - name: Migrate + seed
        run: |
          pnpm db:generate
          pnpm db:migrate:deploy
          pnpm db:seed

      - name: Build workspace packages
        run: >
          pnpm --filter @bidstack/shared --filter @bidstack/dust-client
          --filter @bidstack/odoo-mcp-client --filter @bidstack/db
          --filter @bidstack/memos --filter @bidstack/integrations build

      - name: Build web
        run: pnpm --filter @bidstack/web build

      - name: Start API in background
        run: |
          pnpm --filter @bidstack/api dev &
          # Wait up to 30s for /health.
          for i in {1..30}; do
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "API up after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run Playwright smoke suite
        env:
          E2E_API_URL: http://localhost:4000
        run: pnpm --filter @bidstack/web e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
