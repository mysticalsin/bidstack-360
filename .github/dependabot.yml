# Dependabot — keeps dependencies and pinned GitHub Actions current.
# Pairs with the SHA-pinned `uses:` refs in .github/workflows/*: Dependabot
# understands the "# vX" comment and bumps the commit SHA + comment together,
# so pinning does not freeze us on a stale (or later-vulnerable) action.
version: 2
updates:
  # GitHub Actions — keep the SHA pins fresh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  # npm / pnpm workspace deps. The root pnpm-lock.yaml covers the whole
  # monorepo (apps/* + packages/*). Minor + patch are grouped to cut PR noise;
  # majors come as individual PRs so breaking changes get reviewed alone.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
