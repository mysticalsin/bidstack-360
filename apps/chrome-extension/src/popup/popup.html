<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polo PreSales CRM</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container" id="app">
    <!-- Header -->
    <header class="popup-header">
      <img src="../icons/icon-48.png" alt="" width="24" height="24" />
      <span class="popup-title">Polo PreSales</span>
      <a href="../options/options.html" target="_blank" class="settings-btn" aria-label="Settings" title="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </a>
    </header>

    <!-- Search -->
    <div class="search-section">
      <label for="search-input" class="sr-only">Search Polo PreSales records</label>
      <div class="search-wrapper">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input id="search-input" type="search" placeholder="Search leads, contacts, deals…" autocomplete="off" />
      </div>
    </div>

    <!-- Search results -->
    <div id="search-results" class="results-section" aria-live="polite" aria-label="Search results"></div>

    <!-- Today's tasks -->
    <section class="tasks-section">
      <h2 class="section-title">Today's Tasks</h2>
      <div id="tasks-list" class="tasks-list" aria-live="polite">
        <div class="loading-state">Loading tasks…</div>
      </div>
    </section>

    <!-- Quick create -->
    <section class="quick-create-section">
      <h2 class="section-title">Quick Create Lead</h2>
      <form id="quick-create-form" novalidate>
        <div class="form-group">
          <label for="lead-name">Name <span aria-hidden="true">*</span></label>
          <input id="lead-name" name="name" type="text" required placeholder="Contact or company name" />
        </div>
        <div class="form-group">
          <label for="lead-email">Email</label>
          <input id="lead-email" name="email" type="email" placeholder="email@example.com" />
        </div>
        <button type="submit" class="btn-primary">Add Lead</button>
        <div id="create-status" role="status" aria-live="polite"></div>
      </form>
    </section>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
