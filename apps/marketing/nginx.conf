server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip and brotli for text payloads — keeps marketing JS/CSS under the budget.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;

    # Long cache for hashed asset bundles — Vite always emits content-hashed
    # filenames, so immutable + 1y is safe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Marketing-friendly cache for og images / favicon.
    location ~* \.(svg|png|jpg|jpeg|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # SEO files — short cache so we can ship updates fast.
    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Security headers. The marketing site has no inline scripts beyond the
    # tiny theme-bootstrap in index.html, so this CSP is intentionally tight.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Health check for compose/k8s.
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # SPA fallback — every unknown route renders index.html so client-side
    # routing handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
