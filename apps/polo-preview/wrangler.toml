# polo-preview Worker. Deploy ONLY from the preview box with
# `npx wrangler deploy` after a human review. CI must never upload this
# script: a binding/secret/migration mismatch drops the box relay and the
# Access-gated URL goes 502.
#
# Existing production identity (do not recreate):
#   account 294885a27b3cc0a1cbe5d0ccbe38de4f
#   worker  polo-preview
#   DO      RELAY / Relay / namespace 0d921e2b3ba74386afdb1147745866d0
#   secret  RELAY_KEY (set once on the Worker; never committed)

name = "polo-preview"
main = "src/worker.js"
compatibility_date = "2026-10-01"
account_id = "294885a27b3cc0a1cbe5d0ccbe38de4f"
workers_dev = true

[vars]
ACCESS_AUD = "826c47f72e2aa2bb7973d533363fcc2b536137578c33a3f1972afb90584e686c"
ALLOWED_EMAILS = "tony.walteur@gmail.com,twalteur@amaris.com,marc.bisiou@amaris.com"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

# v1 already exists on the live Worker. Do not add a second migration tag
# unless you intend to replace the namespace (that disconnects the box).
[[migrations]]
tag = "v1"
new_classes = ["Relay"]
