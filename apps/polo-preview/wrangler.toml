# polo-preview Worker. Deploy ONLY after a human review, never from CI: a
# binding/secret/migration mismatch drops the origin and the URL goes 502.
# v29: Polo runs on a Cloudflare Container (PreviewOrigin) built from `main`.
# The box relay stays as a fallback when PREVIEW is not bound.
#
# Existing production identity (do not recreate):
#   account 294885a27b3cc0a1cbe5d0ccbe38de4f
#   worker  polo-preview
#   DO      RELAY / Relay / namespace 0d921e2b3ba74386afdb1147745866d0
#   secret  RELAY_KEY (set once on the Worker; never committed)
#
# Container secrets (names only; values in the macOS Keychain, service toto-os):
#   POLO_INTERNAL_KEY               Worker <-> container control endpoints
#   POLO_INTEGRATION_TOKEN_KEY      API INTEGRATION_TOKEN_KEY (64 hex)
#   POLO_PII_ENCRYPTION_MASTER_KEY  API PII_ENCRYPTION_MASTER_KEY (64 hex)
#   POLO_JOB_SIGNING_SECRET         API BIDSTACK_JOB_SIGNING_SECRET
# The two encryption keys must never change: R2 snapshots hold data
# encrypted with them.
#
# Polo sign-in with a one-time code (off until all three exist):
#   secret  SESSION_SECRET  (wrangler secret put SESSION_SECRET)
#   var     OTP_FROM        sender on a Cloudflare zone with Email Routing
#   binding OTP_EMAIL       [[send_email]] below; recipients must be verified
#                           Email Routing destination addresses

name = "polo-preview"
main = "src/index.js"
compatibility_date = "2026-10-01"
account_id = "294885a27b3cc0a1cbe5d0ccbe38de4f"
workers_dev = true
preview_urls = false

[vars]
ACCESS_AUD = "826c47f72e2aa2bb7973d533363fcc2b536137578c33a3f1972afb90584e686c"
ALLOWED_EMAILS = "tony.walteur@gmail.com,twalteur@amaris.com,marc.bisiou@amaris.com,acamaret@amaris.com"
POLO_ADMIN_EMAILS = "tony.walteur@gmail.com,twalteur@amaris.com"
PUBLIC_ORIGIN = "https://polo-preview.tony-walteur.workers.dev"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[durable_objects.bindings]]
name = "PREVIEW"
class_name = "PreviewOrigin"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "polo-backups"

# v1 already exists on the live Worker. Leave it unchanged.
[[migrations]]
tag = "v1"
new_classes = ["Relay"]

# Adds the container class. Does not touch the Relay namespace.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["PreviewOrigin"]

[[containers]]
class_name = "PreviewOrigin"
image = "./container/Dockerfile"
image_build_context = "../.."
instance_type = "standard-2"
max_instances = 1

# Keeps the container awake and saves changed data to R2.
[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true

# [[send_email]]
# name = "OTP_EMAIL"
