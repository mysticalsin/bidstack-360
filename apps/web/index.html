<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2C4BFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1320" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Google Fonts preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- External Services preconnect -->
    <link rel="preconnect" href="https://clerk.bidstack.dev" />
    <link rel="preconnect" href="https://clerk.accounts.dev" crossorigin />
    <link rel="preconnect" href="https://sentry.io" crossorigin />
    <!-- Preload critical font CSS to avoid render-blocking; swap to all once loaded -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      />
    </noscript>
    <!-- Preload the manifest for PWA installability -->
    <link rel="preload" href="/manifest.json" as="fetch" crossorigin />
    <title>BidStack 360°</title>
    <script>
      // Apply persisted theme before paint to prevent flash.
      (function () {
        try {
          var saved = localStorage.getItem('bidstack-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (prefersDark ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full antialiased">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx" fetchpriority="high"></script>
  </body>
</html>
