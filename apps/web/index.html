<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#006B4F" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1320" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#006B4F" />
    <meta name="description" content="Polo PreSales — bid piloting and pre-sales account intelligence for Mantu teams." />
    <meta property="og:title" content="Polo PreSales" />
    <meta property="og:description" content="Polo PreSales — bid piloting and pre-sales account intelligence for Mantu teams." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- External Services preconnect -->
    <link rel="preconnect" href="https://clerk.accounts.dev" crossorigin />
    <link rel="preconnect" href="https://sentry.io" crossorigin />
    <!-- Preload the manifest for PWA installability -->
    <link rel="preload" href="/manifest.json" as="fetch" crossorigin />
    <title>Polo PreSales</title>
    <script>
      // Apply persisted theme before paint to prevent flash.
      (function () {
        try {
          var saved = localStorage.getItem('bidstack-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (prefersDark ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full antialiased" style="background:#0b0d12;color:#f8fafc">
    <div id="root" class="h-full">
      <p style="margin:1.5rem;font:600 1.25rem/1.4 system-ui,sans-serif">Polo PreSales</p>
    </div>
    <script type="module" src="/src/main.tsx" fetchpriority="high"></script>
  </body>
</html>
