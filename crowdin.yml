# Crowdin configuration for BidStack 360° UI localization.
#
# Free for open-source projects (Crowdin's free OSS plan). No secret is stored in
# this repo: the project id + personal token are read from environment variables
# (set them locally or as GitHub Actions secrets — CROWDIN_PROJECT_ID,
# CROWDIN_PERSONAL_TOKEN). Without them, this file is inert.
#
# Source of truth = the English JSON namespaces under apps/web/public/locales/en.
# Crowdin uploads those as sources and writes translations back into the matching
# per-locale folder. The app's i18next HTTP backend then serves them at runtime.
#
# Workflow:
#   crowdin upload sources       # push en/*.json to Crowdin
#   crowdin download             # pull completed translations into fr/es/pt/it/zh
# (or wire the GitHub Action — see docs/integrations/external-tools.md; the CI
#  workflow file is intentionally NOT committed here because .github/workflows/
#  is coordinate-before-edit per CLAUDE.md.)

project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN

preserve_hierarchy: true

files:
  - source: /apps/web/public/locales/en/*.json
    translation: /apps/web/public/locales/%two_letters_code%/%original_file_name%
    # Crowdin locale codes → our folder names (we ship language-only folders).
    languages_mapping:
      two_letters_code:
        'pt-PT': pt
        'zh-CN': zh
