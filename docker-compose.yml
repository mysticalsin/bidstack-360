services:
  postgres:
    image: postgres:16-alpine
    container_name: bidstack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bidstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-bidstack}
    ports:
      # 5433 to avoid colliding with a host-installed Postgres on 5432.
      # The container still listens internally on 5432; only the host port shifts.
      - '5433:5432'
    volumes:
      - bidstack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER"']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bidstack-redis
    restart: unless-stopped
    ports:
      # 6380 to avoid colliding with a host-installed Redis on 6379.
      - '6380:6379'
    volumes:
      - bidstack_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Odoo MCP sidecar ────────────────────────────────────────────────
  # ivnvxd/mcp-server-odoo exposes an Odoo instance as MCP tools (search,
  # read, create, update, aggregate, chatter, workflow calls). BidStack
  # consumes it as an MCP client via apps/api at /api/integrations/odoo/*.
  #
  # Profile-gated: starts with `docker compose --profile odoo up` so devs
  # who don't run Odoo locally don't see a constantly-failing container.
  # Production deploys override this with a managed sidecar.
  mcp-server-odoo:
    image: ivnvxd/mcp-server-odoo:latest
    container_name: bidstack-mcp-odoo
    restart: unless-stopped
    profiles: ['odoo']
    environment:
      ODOO_URL: ${ODOO_URL:?ODOO_URL is required when starting the odoo profile}
      ODOO_DB: ${ODOO_DB:?ODOO_DB is required when starting the odoo profile}
      ODOO_API_KEY: ${ODOO_API_KEY:-}
      ODOO_USER: ${ODOO_USER:-}
      ODOO_PASSWORD: ${ODOO_PASSWORD:-}
      ODOO_LOCALE: ${ODOO_LOCALE:-en_US}
      ODOO_YOLO: ${ODOO_YOLO:-false}
      ODOO_MCP_ENABLE_METHOD_CALLS: ${ODOO_MCP_ENABLE_METHOD_CALLS:-false}
    command: ['mcp-server-odoo', '--transport', 'streamable-http']
    ports:
      # Host port 8001 → container 8000 to avoid colliding with anything
      # else on 8000. apps/api inside the BIDCRM stack reaches the sidecar
      # on http://mcp-server-odoo:8000/mcp (compose DNS); the host port is
      # purely for ad-hoc curl during development.
      - '8001:8000'

volumes:
  bidstack_pgdata:
  bidstack_redisdata:
