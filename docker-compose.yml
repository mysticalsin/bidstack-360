services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bidstack
      POSTGRES_PASSWORD: bidstack
      POSTGRES_DB: bidstack
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bidstack']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://bidstack:bidstack@postgres:5432/bidstack
    # Deploy-only. The migrate image is intentionally schema-only (Prisma CLI +
    # schema + migrations — no `tsx`/`pnpm`/app source), so it CANNOT run the
    # tsx-based `db seed`; the old `&& pnpm ... seed` command failed at runtime and
    # left this one-shot non-zero, blocking every app service (depends_on:
    # service_completed_successfully). Seeding is a host/dev step: run
    # `pnpm db:seed` against DATABASE_URL once the DB is up (see README/DEV docs).
    command:
      [
        'node',
        'scripts/run-safe-migrate-deploy.mjs',
        '--prisma-bin',
        './packages/db/node_modules/.bin/prisma',
        '--schema',
        'packages/db/prisma/schema.prisma',
      ]

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://bidstack:bidstack@postgres:5432/bidstack
      REDIS_URL: redis://redis:6379
      # Public web origin for the CORS allowlist. Defaults to the local web
      # container origin; override PUBLIC_BASE_URL for any non-local deployment
      # (production boot refuses a localhost value — see apps/api/src/config.ts).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      LOG_LEVEL: info
    ports:
      - '4000:4000'
    volumes:
      - ./apps/api/src:/app/apps/api/src:ro

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    # Wait for the API to be healthy (Dockerfile HEALTHCHECK hits /readyz), not
    # merely started, so the SPA never loads against a not-yet-ready API.
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '80:80'

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://bidstack:bidstack@postgres:5432/bidstack
      REDIS_URL: redis://redis:6379
      OMNIPARSE_BASE_URL: ${OMNIPARSE_BASE_URL:-}
      OMNIPARSE_TIMEOUT_MS: ${OMNIPARSE_TIMEOUT_MS:-60000}
      DUST_RFP_REVIEW_LEGAL_AGENT_ID: ${DUST_RFP_REVIEW_LEGAL_AGENT_ID:-}
      DUST_RFP_REVIEW_FINANCE_AGENT_ID: ${DUST_RFP_REVIEW_FINANCE_AGENT_ID:-}
      DUST_RFP_REVIEW_MARKETING_AGENT_ID: ${DUST_RFP_REVIEW_MARKETING_AGENT_ID:-}
      DUST_RFP_REVIEW_PRESALES_AGENT_ID: ${DUST_RFP_REVIEW_PRESALES_AGENT_ID:-}
      DUST_RFP_REVIEW_BID_AGENT_ID: ${DUST_RFP_REVIEW_BID_AGENT_ID:-}
      RFP_LLM_PROVIDER: ${RFP_LLM_PROVIDER:-}
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-}
      NVIDIA_NIM_MODEL: ${NVIDIA_NIM_MODEL:-}
      NVIDIA_NIM_BASE_URL: ${NVIDIA_NIM_BASE_URL:-}
      LOG_LEVEL: info

  mcp-server:
    build:
      context: .
      target: mcp-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://bidstack:bidstack@postgres:5432/bidstack
      REDIS_URL: redis://redis:6379
      # The MCP HTTP server listens on PORT_MCP (defaults to 4001); pin it to the
      # published port so the 3001 mapping actually reaches a listener.
      PORT_MCP: '3001'
    ports:
      - '3001:3001'

volumes:
  postgres_data:
