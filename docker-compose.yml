version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bidstack
      POSTGRES_PASSWORD: bidstack
      POSTGRES_DB: bidstack
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bidstack']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://bidstack:bidstack@postgres:5432/bidstack
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
    ports:
      - '4000:4000'
    volumes:
      - ./apps/api/src:/app/apps/api/src:ro

  web:
    build:
      context: .
      target: web
    depends_on:
      - api
    ports:
      - '80:80'

  worker:
    build:
      context: .
      target: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://bidstack:bidstack@postgres:5432/bidstack
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info

  mcp-server:
    build:
      context: .
      target: mcp-server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://bidstack:bidstack@postgres:5432/bidstack
      REDIS_URL: redis://redis:6379
    ports:
      - '3001:3001'

volumes:
  postgres_data:
