version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    build:
      context: .
      target: api
      args:
        BIDSTACK_BUILD_AUTH_MODE: clerk
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?VITE_CLERK_PUBLISHABLE_KEY is required for production web builds}
        VITE_API_URL: ${VITE_API_URL:-/api}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?CLERK_SECRET_KEY is required}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?CLERK_PUBLISHABLE_KEY is required}
      STORAGE_DRIVER: ${STORAGE_DRIVER:?STORAGE_DRIVER=s3 is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_REGION: ${S3_REGION:?S3_REGION is required}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      STORAGE_UPLOAD_MAX_BYTES: ${STORAGE_UPLOAD_MAX_BYTES:-52428800}
      STORAGE_SCAN_REQUIRED: ${STORAGE_SCAN_REQUIRED:?STORAGE_SCAN_REQUIRED must be explicit}
      SENTRY_DSN: ${SENTRY_DSN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LOG_LEVEL: warn
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: .
      target: web
      args:
        BIDSTACK_BUILD_AUTH_MODE: clerk
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?VITE_CLERK_PUBLISHABLE_KEY is required for production web builds}
        VITE_API_URL: ${VITE_API_URL:-/api}
        # Pass ASSET_CDN_URL to bake CDN base paths into the Vite build
        ASSET_CDN_URL: ${ASSET_CDN_URL:-}
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 128M
    # Optional: mount a custom nginx.conf with CDN cache headers
    # volumes:
    #   - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro

  # Public marketing site (bidstack.dev). Fully static, no DB / Redis / auth.
  # Built from apps/marketing/Dockerfile; nginx-unprivileged listens on 8080
  # internally, mapped to host port 8081 so it sits beside the web app.
  marketing:
    build:
      context: .
      dockerfile: apps/marketing/Dockerfile
      target: marketing
    ports:
      - '8081:8080'
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 64M

  worker:
    build:
      context: .
      target: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      STORAGE_DRIVER: ${STORAGE_DRIVER:?STORAGE_DRIVER=s3 is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_REGION: ${S3_REGION:?S3_REGION is required}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      BIDSTACK_OCR_ENABLED: ${BIDSTACK_OCR_ENABLED:-true}
      BIDSTACK_OCR_LANGUAGES: ${BIDSTACK_OCR_LANGUAGES:-eng}
      BIDSTACK_OCR_TIMEOUT_MS: ${BIDSTACK_OCR_TIMEOUT_MS:-120000}
      BIDSTACK_OCRMYPDF_BIN: ${BIDSTACK_OCRMYPDF_BIN:-ocrmypdf}
      BIDSTACK_TESSERACT_BIN: ${BIDSTACK_TESSERACT_BIN:-tesseract}
      DUST_API_KEY: ${DUST_API_KEY:-}
      DUST_WORKSPACE_ID: ${DUST_WORKSPACE_ID:-}
      DUST_DOCUMENT_EXTRACT_AGENT_ID: ${DUST_DOCUMENT_EXTRACT_AGENT_ID:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: warn
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M

  mcp-server:
    build:
      context: .
      target: mcp-server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
