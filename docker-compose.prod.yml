services:
  postgres:
    # pgvector image (not postgres:16-alpine): the schema's RFP embeddings use
    # `CREATE EXTENSION vector` + vector(1024) columns + HNSW indexes, which the
    # stock image can't provide — migrate deploy would fail on a fresh DB.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    # Require password auth — unauthenticated Redis on the internal Docker
    # network allows any compromised container to read queues and rate-limit data.
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?REDIS_PASSWORD is required}']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # One-shot migration job: applies pending Prisma migrations, then exits 0.
  # api / worker / mcp-server wait for it to complete successfully, so the whole
  # stack is plug-and-play — `docker compose up` migrates then boots, with no
  # hand-run prisma. A failed migration exits non-zero and blocks the apps.
  migrate:
    build:
      context: .
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    restart: 'no'
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    build:
      context: .
      target: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?CLERK_SECRET_KEY is required}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?CLERK_PUBLISHABLE_KEY is required}
      INTEGRATION_TOKEN_KEY: ${INTEGRATION_TOKEN_KEY:?INTEGRATION_TOKEN_KEY is required}
      STORAGE_DRIVER: ${STORAGE_DRIVER:?STORAGE_DRIVER=s3 is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_REGION: ${S3_REGION:?S3_REGION is required}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      STORAGE_UPLOAD_MAX_BYTES: ${STORAGE_UPLOAD_MAX_BYTES:-52428800}
      STORAGE_SCAN_REQUIRED: ${STORAGE_SCAN_REQUIRED:?STORAGE_SCAN_REQUIRED must be explicit}
      SENTRY_DSN: ${SENTRY_DSN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LOG_LEVEL: warn
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: .
      target: web
      args:
        BIDSTACK_WEB_BUILD_MODE: clerk
        PUBLIC_CLERK_PUBLISHABLE: ${VITE_CLERK_PUBLISHABLE_KEY:?VITE_CLERK_PUBLISHABLE_KEY is required for production web builds}
        VITE_API_URL: ${VITE_API_URL:-/api}
        # Pass ASSET_CDN_URL to bake CDN base paths into the Vite build
        ASSET_CDN_URL: ${ASSET_CDN_URL:-}
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 128M
    # Optional: mount a custom nginx.conf with CDN cache headers
    # volumes:
    #   - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro

  # Public marketing site (bidstack.dev). Fully static, no DB / Redis / auth.
  # Built from apps/marketing/Dockerfile; nginx-unprivileged listens on 8080
  # internally, mapped to host port 8081 so it sits beside the web app.
  marketing:
    build:
      context: .
      dockerfile: apps/marketing/Dockerfile
      target: marketing
    ports:
      - '8081:8080'
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 64M

  worker:
    build:
      context: .
      target: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      INTEGRATION_TOKEN_KEY: ${INTEGRATION_TOKEN_KEY:?INTEGRATION_TOKEN_KEY is required}
      STORAGE_DRIVER: ${STORAGE_DRIVER:?STORAGE_DRIVER=s3 is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_REGION: ${S3_REGION:?S3_REGION is required}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      BIDSTACK_OCR_ENABLED: ${BIDSTACK_OCR_ENABLED:-true}
      BIDSTACK_OCR_LANGUAGES: ${BIDSTACK_OCR_LANGUAGES:-eng}
      BIDSTACK_OCR_TIMEOUT_MS: ${BIDSTACK_OCR_TIMEOUT_MS:-120000}
      BIDSTACK_OCRMYPDF_BIN: ${BIDSTACK_OCRMYPDF_BIN:-ocrmypdf}
      BIDSTACK_TESSERACT_BIN: ${BIDSTACK_TESSERACT_BIN:-tesseract}
      OMNIPARSE_BASE_URL: ${OMNIPARSE_BASE_URL:-}
      OMNIPARSE_TIMEOUT_MS: ${OMNIPARSE_TIMEOUT_MS:-60000}
      DUST_API_KEY: ${DUST_API_KEY:-}
      DUST_WORKSPACE_ID: ${DUST_WORKSPACE_ID:-}
      DUST_DOCUMENT_EXTRACT_AGENT_ID: ${DUST_DOCUMENT_EXTRACT_AGENT_ID:-}
      DUST_RFP_REVIEW_LEGAL_AGENT_ID: ${DUST_RFP_REVIEW_LEGAL_AGENT_ID:-}
      DUST_RFP_REVIEW_FINANCE_AGENT_ID: ${DUST_RFP_REVIEW_FINANCE_AGENT_ID:-}
      DUST_RFP_REVIEW_MARKETING_AGENT_ID: ${DUST_RFP_REVIEW_MARKETING_AGENT_ID:-}
      DUST_RFP_REVIEW_PRESALES_AGENT_ID: ${DUST_RFP_REVIEW_PRESALES_AGENT_ID:-}
      DUST_RFP_REVIEW_BID_AGENT_ID: ${DUST_RFP_REVIEW_BID_AGENT_ID:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: warn
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M

  mcp-server:
    build:
      context: .
      target: mcp-server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
